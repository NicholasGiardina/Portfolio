<text x='11.96' y='47.35' style='font-size: 14.00px;fill: #2D2926; font-family: "Arial";' textLength='843.20px' lengthAdjust='spacingAndGlyphs'>The modeling crosswalk translates 51 canonical fire uses into five descriptor domains and explicit guidance for responsible model reuse.</text>
<text x='11.96' y='27.71' style='font-size: 22.00px; font-weight: bold;fill: #2D2926; font-family: "Arial";' textLength='704.12px' lengthAdjust='spacingAndGlyphs'>From traceable fire-use synthesis to model-facing qualitative priors</text>
<text x='11.96' y='556.23' style='font-size: 11.00px;fill: #625B55; font-family: "Arial";' textLength='247.16px' lengthAdjust='spacingAndGlyphs'>Each crosswalk row represents one canonical use.</text>
<text x='11.96' y='571.80' style='font-size: 11.00px;fill: #625B55; font-family: "Arial";' textLength='414.91px' lengthAdjust='spacingAndGlyphs'>The five domains are organizational display groupings, not additional database fields.</text>
<text x='11.96' y='587.38' style='font-size: 11.00px;fill: #625B55; font-family: "Arial";' textLength='543.06px' lengthAdjust='spacingAndGlyphs'>Values support comparative scenarios—not operational burn prescriptions or measures of historical prevalence.</text>
